<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio de Paul</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav aria-label="Navegación principal">
            <a href="#inicio">Inicio</a>
            <a href="#sobre-mi">Sobre mí</a>
            <a href="#habilidades">Habilidades</a>
            <a href="#proyectos">Proyectos</a>
            <a href="#contacto">Contacto</a>
        </nav>
    </header>

    <main id="inicio">
        <section>
            <div>
                <h1 id="titulo-principal">Hola, soy Paul</h1>
                <p>Soy un desarrollador web.</p>
                <a href="#proyectos">Ver mis proyectos</a>
            </div>
        </section>

        <section id="sobre-mi">
            <h2 id="sobre-mi-titulo">Sobre mí</h2>

            <figure>
                <img src="#" alt="mi portafolio">
                <figcaption>Este wallpaper me gusta mucho. :D</figcaption>
            </figure>
        </section>


        <section id="habilidades">
            <h2>Habilidades</h2>
            <ul>
                <li>HTML</li>
                <li>CSS</li>
                <li>JavaScript</li>
                <li>React</li>
                <li>Node.js</li>
            </ul>
        </section>

        <section id="proyectos">
            <h2 id="proyectos-titulo">Mis Proyectos</h2>

            <article>
                <h3>Sistema Integral de Gestión de Proyectos</h3>
                <p>Proyecto empresarial.</p>
            </article>
        </section>

        <section id="contacto">
            <h2>Contactame</h2>
            <form action="">
                <div>
                    <label for="">Nombre</label>
                    <input type="text">
                    <button>Enviar</button>
                </div>
                <div>
                    <label for="">Correo electrónico</label>
                    <input type="email">
                    <button>Enviar</button>

                </div>

                <div>
                    <label for="">Mensaje</label>
                    <textarea name="" id="" cols="30" rows="10"></textarea>
                    <button>Enviar</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
